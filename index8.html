<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOALPRO ORANGE - 200+ Tournaments</title>
  <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.1/dist/TronWeb.js"></script>
  <script src="https://unpkg.com/@walletconnect/client@1.8.0/dist/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {background: #000; color: #fff; text-align: center; padding: 0; margin: 0; font-family: 'Cairo';}
    .header {background: linear-gradient(135deg, #FF8C00, #FF4500); padding: 30px 20px;}
    .container {padding: 20px; max-width: 700px; margin: auto;}
    #search {width:90%; padding:15px; border-radius:12px; border:none; font-size:16px; margin:20px 0; text-align:center}
    .tournament {background: #111; border: 2px solid #333; border-radius: 15px; padding: 15px; margin: 10px 0; cursor:pointer; transition:0.3s; text-align:right}
    .tournament:hover {border-color:#FF8C00; transform: scale(1.02)}
    .tournament h3 {margin:0; color:#FF8C00}
    .tournament p {margin:5px 0; font-size:13px; opacity:0.8}
    .btn-sub {background: #00FF00; color:#000; border:none; padding:10px 20px; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:10px}
    .wallet-card {background:#111; border:2px solid #00FF00; border-radius:15px; padding:20px; margin:20px 0; display:none}
    .wallet-btn {width:95%; padding:15px; margin:8px; border:none; border-radius:12px; font-weight:bold; cursor:pointer}
    .tronlink {background:#FF4500; color:#fff}
    .trust {background:#00D4FF; color:#000}
  </style>
</head>
<body>
  <div class="header">
    <h1>🏆 GOALPRO ORANGE</h1>
    <p>200+ Worldwide Tournaments 2026-2034</p>
  </div>

  <div class="container">
    <input type="text" id="search" placeholder="🔍 ابحث عن بطولة... UCL, World Cup, Premier League">
    
    <div id="tournaments"></div>

    <div id="walletCard" class="wallet-card">
      <h2>اشترك في <span id="selectedTournament"></span></h2>
      <h3 style="color:#00FF00">50 USDT TRC20</h3>
      <button class="wallet-btn tronlink" onclick="payTronWeb()">🦊 TronLink</button>
      <button class="wallet-btn trust" onclick="payWalletConnect()">📱 Trust Wallet</button>
      <div id="qrcode"></div>
      <div id="status" style="color:#FF8C00; margin-top:10px"></div>
    </div>
  </div>

  <script>
    const MY_WALLET = "THYnJNJ5K49Hk5iACQvSXfgkyj5cLGceoq";
    const USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
    const AMOUNT = 50 * 1000000;
    let selectedTournament = "";

    const tournaments = [
      {name: "UCL UEFA Champions League", country: "Europe", teams: "32 Teams"},
      {name: "Premier League", country: "England", teams: "20 Teams"},
      {name: "La Liga", country: "Spain", teams: "20 Teams"},
      {name: "Bundesliga", country: "Germany", teams: "18 Teams"},
      {name: "Serie A", country: "Italy", teams: "20 Teams"},
      {name: "World Cup 2026 FIFA", country: "World", teams: "48 Teams"},
      {name: "Euro 2028 UEFA", country: "Europe", teams: "24 Teams"},
      {name: "Saudi Pro League", country: "Saudi Arabia", teams: "18 Teams"},
      {name: "MLS", country: "USA", teams: "30 Teams"}
    ];

    function renderTournaments(filter=""){
      const list = tournaments.filter(t => t.name.toLowerCase().includes(filter.toLowerCase()));
      document.getElementById('tournaments').innerHTML = list.map(t => `
        <div class="tournament" onclick="selectTournament('${t.name}')">
          <h3>${t.name}</h3>
          <p>🌍 ${t.country} • 👥 ${t.teams}</p>
          <button class="btn-sub">اشترك الان 50 USDT</button>
        </div>
      `).join('');
    }

    function selectTournament(name){
      selectedTournament = name;
      document.getElementById('selectedTournament').innerText = name;
      document.getElementById('walletCard').style.display = 'block';
      window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
    }

    document.getElementById('search').onkeyup = (e) => renderTournaments(e.target.value);
    renderTournaments();

    async function payTronWeb(){
      if(!window.tronWeb || !window.tronWeb.ready) return alert("❌ نزل TronLink");
      const tx = await window.tronWeb.transactionBuilder.triggerSmartContract(
        USDT, "transfer(address,uint256)", {feeLimit:100000}, 
        [{type:"address", value:MY_WALLET}, {type:"uint256", value:AMOUNT}]
      );
      const signed = await window.tronWeb.trx.sign(tx.transaction);
      const result = await window.tronWeb.trx.sendRawTransaction(signed);
      document.getElementById('status').innerText = result.result ? `✅ تم الاشتراك في ${selectedTournament}` : "❌ فشل الدفع";
    }

    async function payWalletConnect(){
      const connector = new WalletConnect.default({ bridge: "https://bridge.walletconnect.org" });
      await connector.createSession();
      QRCode.toCanvas(document.getElementById('qrcode'), connector.uri);
      document.getElementById('status').innerText = "امسح الكود من Trust Wallet";
      connector.on("connect", () => {
        connector.sendCustomRequest({ method: "tron_sendTransaction", params: [{ to: MY_WALLET, contractAddress: USDT, amount: AMOUNT }]});
      });
    }
  </script>
</body>
</html>
